name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pruebas con PostgreSQL)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: romex
          POSTGRES_USER: romex
          POSTGRES_PASSWORD: romex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U romex -d romex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: romex
      POSTGRES_USER: romex
      POSTGRES_PASSWORD: romex
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: clave-solo-para-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migraciones al día (no debe faltar ninguna)
        run: python manage.py makemigrations --check --dry-run
      - name: Migrar una base vacía
        run: python manage.py migrate
      - name: Pruebas
        run: python manage.py test tests -v 2
      - name: La documentación generada está al día
        run: |
          python manage.py generar_docs
          git diff --exit-code -- ../docs || (echo "Corre 'python manage.py generar_docs' y sube los cambios de docs/." && exit 1)

  frontend:
    name: Frontend (tipos y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Revisión de tipos
        run: npm run typecheck
      - name: Compilar
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: Docker Compose + navegador (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env desde el ejemplo
        run: |
          cp .env.example .env
          # Sin internet real: el backend usa un INEGI de mentira (se levanta abajo)
          echo "INEGI_API_URL=http://localhost:8777/wscatgeo/v2" >> .env
      - name: Levantar todo
        run: docker compose up -d --build
      - name: Esperar al backend
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health/ && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Pruebas del backend dentro del contenedor
        run: docker compose exec -T backend python manage.py test tests
      - name: INEGI de mentira
        run: docker compose exec -d backend python manage.py inegi_falso
      - name: Datos de prueba
        run: docker compose exec -T backend python manage.py seed_e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Esperar al frontend
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 3
          done
          docker compose logs frontend
          exit 1
      - name: Calentar las páginas (el modo desarrollo compila al primer acceso)
        run: |
          for path in login reportes reportes/nuevo dashboard refacciones unidades trabajadores mantenimientos diagnosticos checklists kardex preventivo preventivo/planes bitacora notificaciones cambiar-contrasena; do
            curl -s -o /dev/null --max-time 120 http://localhost:3000/$path
          done
      - name: Pruebas de navegador
        working-directory: frontend
        run: npm run test:e2e
      - name: Informe y capturas de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Apagar
        if: always()
        run: docker compose down -v
